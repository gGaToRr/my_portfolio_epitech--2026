<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Main Electric Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Secondary Cyan/Mint Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Lighting Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="150" fill="#0284c7" opacity="0.22" filter="url(#coreGlow)"/>

  <!-- Stylized Geometric 'P' -->
  <path d="M 124 120 L 236 120 C 290 120 326 150 326 198 C 326 246 290 276 236 276 L 186 276 L 186 392 L 124 392 Z M 186 174 L 186 222 L 232 222 C 256 222 268 214 268 198 C 268 182 256 174 232 174 Z" 
        fill="url(#neonGrad)"/>

  <!-- Stylized Geometric 'U' Interlocking -->
  <path d="M 288 200 L 348 200 L 348 296 C 348 356 312 392 252 392 C 224 392 202 384 186 368 L 218 328 C 228 338 240 344 252 344 C 282 344 290 324 290 296 L 290 200 Z" 
        fill="url(#cyanGrad)"/>

  <!-- High-Tech Slash / Code Accent (Terminal Angle) -->
  <path d="M 334 116 L 372 78 L 392 98 L 354 136 Z" fill="#38bdf8" opacity="0.9"/>

  <!-- Active Status LED / Network Dot -->
  <circle cx="396" cy="116" r="22" fill="#22c55e" stroke="#0f172a" stroke-width="6"/>
  <circle cx="396" cy="116" r="10" fill="#86efac"/>
</svg>

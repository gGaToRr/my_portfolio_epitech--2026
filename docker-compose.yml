services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    # Le conteneur écrit dans ./backend/data et ./backend/logs, montés depuis
    # l'hôte. Il doit donc tourner avec l'uid propriétaire de ces dossiers,
    # sinon l'écriture est refusée et le service ne démarre pas.
    # 1000 couvre le premier compte non-root d'une machine Linux, le cas courant.
    # Si vous déployez sous un autre compte : APP_UID / APP_GID dans .env,
    # ou `id -u` / `id -g` pour connaître les vôtres.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # Publié uniquement sur la boucle locale.
    #
    # "5001:5001" écoutait sur 0.0.0.0 : le backend était donc joignable
    # directement depuis Internet, en HTTP clair, hors du reverse proxy et de
    # son TLS — connexion admin et routes /api/admin/* comprises. Le trafic
    # public passe par nginx -> service "portfolio" -> relais /api -> backend.
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./backend/data:/app/data
      # Les logs sont écrits dans le conteneur : sans ce montage, ils
      # disparaissaient à chaque recréation et la console admin repartait vide.
      - ./backend/logs:/app/logs
    env_file:
      - path: ./backend/.env.local
        required: false
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - API_PORT=5001
      - HOST=0.0.0.0
      # Deux proxys de confiance devant le backend : nginx, puis le relais
      # /api/* de server.js. Voir get_client_ip() dans app/security.py.
      - TRUSTED_PROXY_HOPS=2

  portfolio:
    build:
      context: ./portfolio-v1.2.0/portfo
      dockerfile: Dockerfile
    container_name: pierre_portfolio
    restart: unless-stopped
    # Publié uniquement sur la boucle locale, comme le backend ci-dessus.
    #
    # En "0.0.0.0" le site répondait aussi en HTTP clair sur http://<ip>:3006,
    # hors nginx et hors TLS : ufw n'y changeait rien, Docker insérant ses
    # propres règles iptables en amont des siennes. nginx atteint le
    # conteneur via 127.0.0.1:3006.
    ports:
      - "127.0.0.1:${PORT:-3006}:5001"
    depends_on:
      - backend
    env_file:
      - path: ./portfolio-v1.2.0/portfo/.env.local
        required: false
      - path: ./portfolio-v1.2.0/portfo/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=production
      - API_PORT=5001
      # Cible du relais /api/* de server.js (nom du service Compose).
      - BACKEND_HOST=backend
      - BACKEND_PORT=5001

